name: Build and release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Verify committed build and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git diff --exit-code -- main.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          assert.equal(manifest.version, require('./package.json').version);
          assert.equal(require('./versions.json')[manifest.version], manifest.minAppVersion);
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(manifest.version, process.env.RELEASE_TAG);
          }
          NODE
      - name: Attest release files
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish supported release files
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "$RELEASE_TAG" --generate-notes
